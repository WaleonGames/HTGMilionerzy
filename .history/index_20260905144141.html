<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Milionerzy - Panel sterowania</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <span class="eyebrow">MILIONERZY</span>
        <h1>Panel sterowania</h1>
      </div>

      <div class="status">
        Pytania:
        <strong id="questionCount">0</strong>
      </div>
    </header>

    <section class="panel">
      <h2>Dodaj pytanie</h2>

      <form id="questionForm">
        <div class="field">
          <label for="questionInput">Pytanie</label>
          <textarea
            id="questionInput"
            rows="3"
            placeholder="Wpisz treść pytania..."
            required
          ></textarea>
        </div>

        <div class="answers-form">
          <div class="answer-input">
            <span>A</span>
            <input
              id="answerA"
              type="text"
              placeholder="Odpowiedź A"
              required
            >
          </div>

          <div class="answer-input">
            <span>B</span>
            <input
              id="answerB"
              type="text"
              placeholder="Odpowiedź B"
              required
            >
          </div>

          <div class="answer-input">
            <span>C</span>
            <input
              id="answerC"
              type="text"
              placeholder="Odpowiedź C"
              required
            >
          </div>

          <div class="answer-input">
            <span>D</span>
            <input
              id="answerD"
              type="text"
              placeholder="Odpowiedź D"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="correctAnswer">Poprawna odpowiedź</label>

          <select id="correctAnswer" required>
            <option value="">Wybierz...</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>

        <button class="primary-button" type="submit">
          Dodaj pytanie
        </button>
      </form>
    </section>

    <section class="panel game-panel">
      <div class="game-header">
        <div>
          <span class="eyebrow">AKTUALNE PYTANIE</span>
          <h2 id="currentQuestion">
            Najpierw dodaj pytanie
          </h2>
        </div>

        <span id="questionNumber" class="question-number">
          0 / 0
        </span>
      </div>

      <div id="gameAnswers" class="game-answers">
        <button class="game-answer" data-answer="A" type="button">
          <strong>A</strong>
          <span>—</span>
        </button>

        <button class="game-answer" data-answer="B" type="button">
          <strong>B</strong>
          <span>—</span>
        </button>

        <button class="game-answer" data-answer="C" type="button">
          <strong>C</strong>
          <span>—</span>
        </button>

        <button class="game-answer" data-answer="D" type="button">
          <strong>D</strong>
          <span>—</span>
        </button>
      </div>

      <div class="game-actions">
        <button
          id="checkAnswerButton"
          class="check-button"
          type="button"
          disabled
        >
          Sprawdź odpowiedź
        </button>

        <button
          id="nextQuestionButton"
          class="secondary-button"
          type="button"
          disabled
        >
          Następne pytanie
        </button>
      </div>

      <div id="result" class="result" hidden></div>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
