<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Milionerzy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="main-menu">
    <div class="menu-header">
      <span class="eyebrow">MILIONERZY</span>
      <h1>Panel główny</h1>
      <p>Wybierz, co chcesz zrobić.</p>
    </div>

    <div class="menu-grid">
      <button class="menu-card primary" id="startGameButton">
        <span class="menu-card-title">Rozpocznij grę</span>
        <span class="menu-card-description">
          Uruchom nową rozgrywkę.
        </span>
      </button>

      <button class="menu-card" id="questionsButton">
        <span class="menu-card-title">Pytania</span>
        <span class="menu-card-description">
          Dodawaj i edytuj pytania.
        </span>
      </button>

      <button class="menu-card" id="settingsButton">
        <span class="menu-card-title">Ustawienia</span>
        <span class="menu-card-description">
          Ustawienia aplikacji i rozgrywki.
        </span>
      </button>

      <button class="menu-card danger" id="exitButton">
        <span class="menu-card-title">Wyjdź</span>
        <span class="menu-card-description">
          Zamknij aplikację.
        </span>
      </button>
    </div>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
