<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>Milionerzy - Gra</title>

  <link rel="stylesheet" href="../public/css/design.css">
  <link rel="stylesheet" href="../public/css/game.css">
</head>
<body>
  <div class="game-app sidebar-hidden">
    <main class="game-stage">
      <section class="game-question-area">
        <div 
          id="gameQuestionMeta"
          class="game-question-meta technical-info"
          hidden
        >
          <span id="questionNumber">
            Pytanie 1
          </span>

          <span id="questionProgress">
            1 / 12
          </span>
        </div>

        <div
          id="questionText"
          class="game-question"
        >
          Brak załadowanego pytania.
        </div>

        <div
          id="answersGrid"
          class="game-answers"
        >
          <button
            class="game-answer"
            data-answer="A"
            type="button"
          >
            <span class="game-answer-letter">
              A
            </span>

            <span
              id="answerTextA"
              class="game-answer-text"
            >
              —
            </span>
          </button>

          <button
            class="game-answer"
            data-answer="B"
            type="button"
          >
            <span class="game-answer-letter">
              B
            </span>

            <span
              id="answerTextB"
              class="game-answer-text"
            >
              —
            </span>
          </button>

          <button
            class="game-answer"
            data-answer="C"
            type="button"
          >
            <span class="game-answer-letter">
              C
            </span>

            <span
              id="answerTextC"
              class="game-answer-text"
            >
              —
            </span>
          </button>

          <button
            class="game-answer"
            data-answer="D"
            type="button"
          >
            <span class="game-answer-letter">
              D
            </span>

            <span
              id="answerTextD"
              class="game-answer-text"
            >
              —
            </span>
          </button>
        </div>
      </section>
    </main>

    <aside class="game-sidebar hidden">
      <section class="game-sidebar-section">
        <div
          class="game-sidebar-title technical-info"
          hidden
        >
          Koła ratunkowe
        </div>

        <div class="game-lifelines">
          <div
            class="game-lifeline"
            title="50:50"
          >
            <img
              src="../public/assets/lifelines/ll_5050.png"
              alt="50:50"
            >
          </div>

          <div
            class="game-lifeline"
            title="Publiczność"
          >
            <img
              src="../public/assets/lifelines/ll_audience.png"
              alt="Publiczność"
            >
          </div>

          <div
            class="game-lifeline"
            title="Pytanie do hosta"
          >
            <img
              src="../public/assets/lifelines/ll_host.png"
              alt="Pytanie do hosta"
            >
          </div>
        </div>
      </section>

      <section class="game-sidebar-section game-sidebar-section-grow">
        <div
          class="game-sidebar-title technical-info"
          hidden
        >
          Drzewo nagród
        </div>

        <div
          id="gamePrizeTree"
          class="game-prize-tree"
        ></div>
      </section>
    </aside>

    <button
      id="openControlsButton"
      class="game-control-rail"
      type="button"
      aria-label="Otwórz sterowanie"
      title="Sterowanie"
    >
      <span class="game-control-rail-line"></span>

      <span class="game-control-rail-label">
        Sterowanie
      </span>
    </button>

    <div
      id="controlsBackdrop"
      class="game-offcanvas-backdrop"
      hidden
    ></div>

    <aside
      id="controlsPanel"
      class="game-offcanvas"
      aria-hidden="true"
    >
      <div class="game-offcanvas-header">
        <div>
          <span class="game-eyebrow">
            HOST
          </span>

          <h2>
            Sterowanie
          </h2>
        </div>

        <button
          id="closeControlsButton"
          class="game-icon-button"
          type="button"
          aria-label="Zamknij"
        >
          ×
        </button>
      </div>

      <div class="game-offcanvas-content">
        <!-- =========================
            WYŚWIETLANIE
        ========================= -->

        <section class="game-control-section">
          <h3>
            Wyświetlanie
          </h3>

          <div class="game-display-controls game-display-controls-3">
            <button
              id="showQuestionButton"
              class="game-button"
              type="button"
            >
              Pytanie
            </button>

            <button
              id="showAnswersButton"
              class="game-button"
              type="button"
            >
              Odpowiedzi
            </button>

            <button
              id="toggleSidebarButton"
              class="game-button"
              type="button"
            >
              Panel boczny
            </button>
          </div>
        </section>

        <!-- =========================
            KOŁA RATUNKOWE
        ========================= -->

        <section class="game-control-section">
          <h3>
            Koła ratunkowe
          </h3>

          <div class="game-display-controls game-display-controls-2">
            <button
              id="flash5050Button"
              class="game-button"
              type="button"
            >
              50:50
            </button>

            <button
              id="flashAudienceButton"
              class="game-button"
              type="button"
            >
              Publiczność
            </button>
          </div>
        </section>

        <!-- =========================
            ODPOWIEDŹ GRACZA
        ========================= -->

        <section class="game-control-section">
          <h3>
            Odpowiedź gracza
          </h3>

          <div class="game-selected-answer">
            <span>
              Wybrana odpowiedź
            </span>

            <strong id="selectedAnswer">
              Brak
            </strong>
          </div>

          <button
            id="checkAnswerButton"
            class="game-button game-button-primary"
            type="button"
            disabled
          >
            Sprawdź odpowiedź
          </button>
        </section>

        <!-- =========================
            WYNIK
        ========================= -->

        <section class="game-control-section">
          <h3>
            Wynik
          </h3>

          <div class="game-result">
            <span>
              Status
            </span>

            <strong id="answerResult">
              —
            </strong>
          </div>
        </section>

        <!-- =========================
            NAWIGACJA
        ========================= -->

        <section class="game-control-section">
          <h3>
            Nawigacja
          </h3>

          <div class="game-control-grid">
            <button
              id="previousQuestionButton"
              class="game-button"
              type="button"
            >
              Poprzednie
            </button>

            <button
              id="nextQuestionButton"
              class="game-button game-button-primary"
              type="button"
            >
              Następne
            </button>
          </div>
        </section>
      </div>

      <div class="game-offcanvas-footer">
        <button
          id="exitGameButton"
          class="game-button game-button-danger"
          type="button"
        >
          Zakończ rozgrywkę
        </button>
      </div>
    </aside>
  </div>

  <script src="../public/js/design.js"></script>
  <script src="../public/js/game.js"></script>
</body>
</html>
