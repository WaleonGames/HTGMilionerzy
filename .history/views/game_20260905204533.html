<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>Milionerzy - Gra</title>

  <link rel="stylesheet" href="../public/css/design.css">
  <link rel="stylesheet" href="../public/css/game.css">
</head>
<body>
  <div class="game-app">
    <header class="game-topbar">
      <div class="game-topbar-left">
        <span class="game-eyebrow">
          MILIONERZY
        </span>

        <strong id="gameStatus">
          Rozgrywka
        </strong>
      </div>

      <div class="game-topbar-actions">
        <button
          id="openControlsButton"
          class="game-button"
          type="button"
        >
          Sterowanie
        </button>

        <button
          id="exitGameButton"
          class="game-button game-button-danger"
          type="button"
        >
          Zakończ
        </button>
      </div>
    </header>

    <main class="game-stage">
      <section class="game-question-area">
        <div class="game-question-meta">
          <span id="questionNumber">
            Pytanie 1
          </span>

          <span id="questionProgress">
            1 / 12
          </span>
        </div>

        <div
          id="questionText"
          class="game-question"
        >
          Brak załadowanego pytania.
        </div>

        <div
          id="answersGrid"
          class="game-answers"
        >
          <button
            class="game-answer"
            data-answer="A"
            type="button"
          >
            <span class="game-answer-letter">
              A
            </span>

            <span
              id="answerTextA"
              class="game-answer-text"
            >
              —
            </span>
          </button>

          <button
            class="game-answer"
            data-answer="B"
            type="button"
          >
            <span class="game-answer-letter">
              B
            </span>

            <span
              id="answerTextB"
              class="game-answer-text"
            >
              —
            </span>
          </button>

          <button
            class="game-answer"
            data-answer="C"
            type="button"
          >
            <span class="game-answer-letter">
              C
            </span>

            <span
              id="answerTextC"
              class="game-answer-text"
            >
              —
            </span>
          </button>

          <button
            class="game-answer"
            data-answer="D"
            type="button"
          >
            <span class="game-answer-letter">
              D
            </span>

            <span
              id="answerTextD"
              class="game-answer-text"
            >
              —
            </span>
          </button>
        </div>
      </section>
    </main>

    <div
      id="controlsBackdrop"
      class="game-offcanvas-backdrop"
      hidden
    ></div>

    <aside
      id="controlsPanel"
      class="game-offcanvas"
      aria-hidden="true"
    >
      <div class="game-offcanvas-header">
        <div>
          <span class="game-eyebrow">
            HOST
          </span>

          <h2>
            Sterowanie
          </h2>
        </div>

        <button
          id="closeControlsButton"
          class="game-icon-button"
          type="button"
          aria-label="Zamknij"
        >
          ×
        </button>
      </div>

      <div class="game-offcanvas-content">
        <section class="game-control-section">
          <h3>
            Wyświetlanie
          </h3>

          <button
            id="showQuestionButton"
            class="game-button"
            type="button"
          >
            Pokaż pytanie
          </button>

          <button
            id="showAnswersButton"
            class="game-button"
            type="button"
          >
            Pokaż odpowiedzi
          </button>
        </section>

        <section class="game-control-section">
          <h3>
            Odpowiedź gracza
          </h3>

          <div class="game-selected-answer">
            <span>
              Wybrana odpowiedź
            </span>

            <strong id="selectedAnswer">
              Brak
            </strong>
          </div>

          <button
            id="checkAnswerButton"
            class="game-button game-button-primary"
            type="button"
            disabled
          >
            Sprawdź odpowiedź
          </button>
        </section>

        <section class="game-control-section">
          <h3>
            Wynik
          </h3>

          <div class="game-result">
            <span>
              Status
            </span>

            <strong id="answerResult">
              —
            </strong>
          </div>
        </section>

        <section class="game-control-section">
          <h3>
            Nawigacja
          </h3>

          <div class="game-control-grid">
            <button
              id="previousQuestionButton"
              class="game-button"
              type="button"
            >
              Poprzednie
            </button>

            <button
              id="nextQuestionButton"
              class="game-button game-button-primary"
              type="button"
            >
              Następne
            </button>
          </div>
        </section>
      </div>
    </aside>
  </div>

  <script src="../public/js/design.js"></script>
  <script src="../public/js/game.js"></script>
</body>
</html>
