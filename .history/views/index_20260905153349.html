<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Milionerzy</title>
  <link rel="stylesheet" href="../public/css/style.css">
  <link rel="stylesheet" href="../public/css/style.css">
  <link rel="stylesheet" href="../public/css/design.css">
</head>
<body>
  <main class="main-menu">
    <header class="menu-header">
      <span class="eyebrow">MILIONERZY</span>
      <h1>Panel główny</h1>
      <p>Wybierz, co chcesz zrobić.</p>
    </header>

    <section class="menu-grid">
      <button
        id="startGameButton"
        class="menu-card menu-card-primary"
        type="button"
      >
        <span class="menu-card-title">Rozpocznij grę</span>
        <span class="menu-card-description">
          Uruchom nową rozgrywkę.
        </span>
      </button>

      <button
        id="questionsButton"
        class="menu-card"
        type="button"
      >
        <span class="menu-card-title">Pytania</span>
        <span class="menu-card-description">
          Dodawaj i zarządzaj pytaniami.
        </span>
      </button>

      <button
        id="settingsButton"
        class="menu-card"
        type="button"
      >
        <span class="menu-card-title">Ustawienia</span>
        <span class="menu-card-description">
          Konfiguracja aplikacji i rozgrywki.
        </span>
      </button>

      <button
        id="exitButton"
        class="menu-card menu-card-danger"
        type="button"
      >
        <span class="menu-card-title">Wyjdź</span>
        <span class="menu-card-description">
          Zamknij aplikację.
        </span>
      </button>
    </section>
  </main>

  <script src="../public/js/design.js"></script>
  <script src="../public/js/main.js"></script>
</body>
</html>
