<!-- =========================
     ODPOWIEDŹ GRACZA
========================= -->

<section class="game-control-section">
  <h3>
    Odpowiedź gracza
  </h3>

  <div
    id="hostAnswerGrid"
    class="game-host-answers"
  >
    <button
      class="game-button game-host-answer"
      data-host-answer="A"
      type="button"
      disabled
    >
      A
    </button>

    <button
      class="game-button game-host-answer"
      data-host-answer="B"
      type="button"
      disabled
    >
      B
    </button>

    <button
      class="game-button game-host-answer"
      data-host-answer="C"
      type="button"
      disabled
    >
      C
    </button>

    <button
      class="game-button game-host-answer"
      data-host-answer="D"
      type="button"
      disabled
    >
      D
    </button>
  </div>

  <div class="game-selected-answer">
    <span>
      Wybrana odpowiedź
    </span>

    <strong id="selectedAnswer">
      Brak
    </strong>

    <small
      id="answerConfirmHint"
      class="game-answer-confirm-hint"
    >
      Wybierz odpowiedź.
    </small>
  </div>
</section>
