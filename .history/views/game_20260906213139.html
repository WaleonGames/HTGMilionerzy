<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>Milionerzy - Gra</title>

  <link rel="stylesheet" href="../public/css/design.css">
  <link rel="stylesheet" href="../public/css/game.css">
</head>
<body>
  <div class="game-app sidebar-hidden">

    <!-- =========================
         GŁÓWNY EKRAN
    ========================= -->

    <main class="game-stage">
      <section class="game-question-area">

        <!-- INFORMACJE TECHNICZNE -->
        <div
          id="gameQuestionMeta"
          class="game-question-meta technical-info"
          hidden
        >
          <span id="questionNumber">
            Pytanie 1
          </span>

          <span id="questionProgress">
            1 / 12
          </span>
        </div>

        <!-- PYTANIE -->
        <div
          id="questionText"
          class="game-question"
          hidden
        ></div>

        <!-- ODPOWIEDZI -->
        <div
          id="answersGrid"
          class="game-answers"
          hidden
        >
          <div
            class="game-answer"
            data-answer="A"
          >
            <span class="game-answer-letter">
              A
            </span>

            <span
              id="answerTextA"
              class="game-answer-text"
            ></span>
          </div>

          <div
            class="game-answer"
            data-answer="B"
          >
            <span class="game-answer-letter">
              B
            </span>

            <span
              id="answerTextB"
              class="game-answer-text"
            ></span>
          </div>

          <div
            class="game-answer"
            data-answer="C"
          >
            <span class="game-answer-letter">
              C
            </span>

            <span
              id="answerTextC"
              class="game-answer-text"
            ></span>
          </div>

          <div
            class="game-answer"
            data-answer="D"
          >
            <span class="game-answer-letter">
              D
            </span>

            <span
              id="answerTextD"
              class="game-answer-text"
            ></span>
          </div>
        </div>
      </section>
    </main>

    <!-- =========================
         PANEL BOCZNY
    ========================= -->

    <aside class="game-sidebar hidden">

      <!-- KOŁA RATUNKOWE -->
      <section class="game-sidebar-section">

        <div
          class="game-sidebar-title technical-info"
          hidden
        >
          Koła ratunkowe
        </div>

        <div class="game-lifelines">
          <div
            class="game-lifeline"
            title="50:50"
          >
            <img
              id="lifeline5050Image"
              src="../public/assets/lifelines/50-50.png"
              alt="50:50"
            >
          </div>

          <div
            class="game-lifeline"
            title="Publiczność"
          >
            <img
              id="lifelineAudienceImage"
              src="../public/assets/lifelines/publiczność.png"
              alt="Publiczność"
            >
          </div>

          <div
            class="game-lifeline"
            title="Pytanie do prowadzącego"
          >
            <img
              id="lifelineHostImage"
              src="../public/assets/lifelines/pytanie do prowadzącego.png"
              alt="Pytanie do prowadzącego"
            >
          </div>
        </div>
      </section>

      <!-- DRZEWO NAGRÓD -->
      <section
        class="game-sidebar-section game-sidebar-section-grow"
      >
        <div
          class="game-sidebar-title technical-info"
          hidden
        >
          Drzewo nagród
        </div>

        <div
          id="gamePrizeTree"
          class="game-prize-tree"
        ></div>
      </section>
    </aside>

    <!-- =========================
         OTWIERANIE STEROWANIA
    ========================= -->

    <button
      id="openControlsButton"
      class="game-control-rail"
      type="button"
      aria-label="Otwórz sterowanie"
      title="Sterowanie"
    >
      <span class="game-control-rail-line"></span>

      <span class="game-control-rail-label">
        Sterowanie
      </span>
    </button>

    <!-- =========================
         BACKDROP
    ========================= -->

    <div
      id="controlsBackdrop"
      class="game-offcanvas-backdrop"
      hidden
    ></div>

    <!-- =========================
         OFFCANVAS HOSTA
    ========================= -->

    <aside
      id="controlsPanel"
      class="game-offcanvas"
      aria-hidden="true"
    >

      <!-- =========================
           HEADER
      ========================= -->

      <div class="game-offcanvas-header">
        <div>
          <span class="game-eyebrow">
            HOST
          </span>

          <h2>
            Sterowanie
          </h2>
        </div>

        <div class="game-offcanvas-header-actions">
          <button
            id="detachControlsButton"
            class="game-icon-button"
            type="button"
            aria-label="Wyciągnij sterowanie"
            title="Wyciągnij sterowanie"
          >
            ↗
          </button>

          <button
            id="closeControlsButton"
            class="game-icon-button"
            type="button"
            aria-label="Zamknij"
          >
            ×
          </button>
        </div>
      </div>

      <!-- =========================
           CONTENT
      ========================= -->

      <div class="game-offcanvas-content">

        <!-- =========================
             PANEL BOCZNY
        ========================= -->

        <section class="game-control-section">
          <h3>
            Panel boczny
          </h3>

          <button
            id="toggleSidebarButton"
            class="game-button"
            type="button"
          >
            Panel boczny
          </button>

          <div class="game-control-subsection">
            <span class="game-control-label">
              Koła ratunkowe
            </span>

            <div
              class="game-display-controls game-display-controls-2"
            >
              <button
                id="lifeline5050Button"
                class="game-button"
                type="button"
              >
                50:50
              </button>

              <button
                id="lifelineAudienceButton"
                class="game-button"
                type="button"
              >
                Publiczność
              </button>
              <button
                id="lifelineAudienceButton"
                class="game-button"
                type="button"
              >
                Publiczność
              </button>
            </div>
          </div>
        </section>

        <!-- =========================
             PANEL GŁÓWNY
        ========================= -->

        <section class="game-control-section">
          <h3>
            Panel główny
          </h3>

          <button
            id="showMainPanelButton"
            class="game-button game-button-primary"
            type="button"
          >
            Pokaż menu główne
          </button>

          <div class="game-control-subsection">
            <span class="game-control-label">
              Pytanie
            </span>

            <div
              class="game-display-controls game-display-controls-2"
            >
              <button
                id="showQuestionButton"
                class="game-button"
                type="button"
                disabled
              >
                Pytanie
              </button>

              <button
                id="showAnswersButton"
                class="game-button"
                type="button"
                disabled
              >
                Odpowiedzi
              </button>
            </div>
          </div>
        </section>

        <!-- =========================
            ODPOWIEDŹ GRACZA
        ========================= -->

        <section class="game-control-section">
          <h3>
            Odpowiedź gracza
          </h3>

          <div
            id="hostAnswerGrid"
            class="game-host-answers"
          >
            <button
              class="game-button game-host-answer"
              data-host-answer="A"
              type="button"
              disabled
            >
              A
            </button>

            <button
              class="game-button game-host-answer"
              data-host-answer="B"
              type="button"
              disabled
            >
              B
            </button>

            <button
              class="game-button game-host-answer"
              data-host-answer="C"
              type="button"
              disabled
            >
              C
            </button>

            <button
              class="game-button game-host-answer"
              data-host-answer="D"
              type="button"
              disabled
            >
              D
            </button>
          </div>

          <div class="game-selected-answer">
            <span>
              Wybrana odpowiedź
            </span>

            <strong id="selectedAnswer">
              Brak
            </strong>

            <small
              id="answerConfirmHint"
              class="game-answer-confirm-hint"
            >
              Wybierz odpowiedź.
            </small>
          </div>
        </section>

        <!-- =========================
             WYNIK
        ========================= -->

        <section class="game-control-section">
          <h3>
            Wynik
          </h3>

          <div class="game-result">
            <span>
              Status
            </span>

            <strong id="answerResult">
              Oczekiwanie
            </strong>
          </div>
        </section>

        <!-- =========================
             ROZGRYWKA
        ========================= -->

        <section class="game-control-section">
          <h3>
            Rozgrywka
          </h3>

          <button
            id="nextQuestionButton"
            class="game-button game-button-primary"
            type="button"
            disabled
          >
            Następne pytanie
          </button>
        </section>
      </div>

      <!-- =========================
           FOOTER
      ========================= -->

      <div class="game-offcanvas-footer">
        <button
          id="exitGameButton"
          class="game-button game-button-danger"
          type="button"
        >
          Zakończ grę
        </button>
      </div>
    </aside>
  </div>

  <script src="../public/js/design.js"></script>
  <script src="../public/js/game.js"></script>
</body>
</html>
