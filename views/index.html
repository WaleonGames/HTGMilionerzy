<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>Milionerzy</title>

  <link rel="stylesheet" href="../public/css/style.css">
  <link rel="stylesheet" href="../public/css/design.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="page-header-main">
        <span class="eyebrow">
          MILIONERZY
        </span>

        <h1 class="page-title">
          Panel główny
        </h1>

        <p class="page-description">
          Wybierz, co chcesz zrobić.
        </p>
      </div>
    </header>

    <section class="grid grid-2">
      <button
        id="startGameButton"
        class="card action-card action-card-primary"
        type="button"
      >
        <span class="action-card-title">
          Rozpocznij grę
        </span>

        <span class="action-card-description">
          Uruchom nową rozgrywkę.
        </span>
      </button>

      <button
        id="questionsButton"
        class="card action-card"
        type="button"
      >
        <span class="action-card-title">
          Pytania
        </span>

        <span class="action-card-description">
          Dodawaj i zarządzaj pytaniami.
        </span>
      </button>

      <button
        id="settingsButton"
        class="card action-card"
        type="button"
      >
        <span class="action-card-title">
          Ustawienia
        </span>

        <span class="action-card-description">
          Konfiguracja aplikacji i rozgrywki.
        </span>
      </button>

      <button
        id="exitButton"
        class="card action-card action-card-danger"
        type="button"
      >
        <span class="action-card-title">
          Wyjdź
        </span>

        <span class="action-card-description">
          Zamknij aplikację.
        </span>
      </button>
    </section>
  </main>

  <script src="../public/js/design.js"></script>
  <script src="../public/js/main.js"></script>
</body>
</html>
